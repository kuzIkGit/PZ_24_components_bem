
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Компоненты</title>

    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/layouts/page.css" />
    <link rel="stylesheet" href="./styles/components/card.css" />
    <link rel="stylesheet" href="./styles/components/button.css" />
    <link rel="stylesheet" href="./styles/components/badge.css" />
  </head>

  <body class="page">
    <header class="page__header">
      <div class="page__logo">CITY LAB</div>
      <a class="button button--small" href="#cards">Карточки</a>
    </header>

    <main class="page__main">
      <section class="page__hero">
        <h1 class="page__title">Компонентный подход</h1>
        <p class="page__text">
          Один интерфейс — много переиспользуемых частей.
        </p>
      </section>

      <section class="cards" id="cards">
        <article class="card cards__item">
          <span class="badge">01</span>

          <h2 class="card__title">Независимость</h2>

          <p class="card__text">
            Компонент не должен неожиданно зависеть от окружения.
          </p>

          <a class="button" href="#">Подробнее</a>
        </article>

        <article class="card cards__item cards__item--small">
          <span class="badge badge--small">02</span>

          <h2 class="card__title">Повторное использование</h2>

          <p class="card__text">
            Одинаковые элементы должны переиспользоваться.
          </p>

          <a class="button button--accent" href="#">Подробнее</a>
        </article>
      </section>
    </main>
  </body>
</html>
